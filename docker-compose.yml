services:
    alice:
        build:
            context: .
            dockerfile: Dockerfile
        privileged: true
        volumes:
            - ./src:/scripts
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        environment:
          - JITTER_ENABLED=${JITTER_ENABLED:-1}
          - EXECUTE_COMMANDS=${EXECUTE_COMMANDS:-1}
        networks:
            net_alice:
              ipv4_address: 172.7.0.2
        depends_on:
            - "warden"
            - "bob"
        command: bash -c "/scripts/alice.sh && sleep infinity"
        extra_hosts:
          - "bob:172.8.0.3"
    bob:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./src:/scripts
            - ./http_server:/http_server
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        networks:
            net_bob:
              ipv4_address: 172.8.0.3
        depends_on:
            - "warden"
        sysctls:
          - net.ipv4.ip_forward=1
        command: bash -c "/scripts/bob.sh && sleep infinity"
    warden:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./src:/scripts
        tty: true
        cap_add:
          - NET_ADMIN
          - NET_RAW
          - SYS_ADMIN
        environment:
          - REORDER_PCT=${REORDER_PCT:-25}
        networks:
            net_alice:
              ipv4_address: 172.7.0.254
            net_bob:
              ipv4_address: 172.8.0.254
        sysctls:
          - net.ipv4.ip_forward=1
        command: bash -c "/scripts/warden.sh && sleep infinity" # && /alter_packages.sh
networks:
  net_alice:
    ipam:
      config:
        - subnet: 172.7.0.0/24
  net_bob:
    ipam:
      config:
        - subnet: 172.8.0.0/24